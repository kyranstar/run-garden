name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the e2e job be proven on any branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Unit + integration tests (vitest)
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @rg/web build

  migrations:
    # Migrations are hand-authored (drizzle-kit's journal stops at 0016 by
    # design), so regenerating and diffing can never pass. This runs the checks
    # that can: numbering contiguous from 0000, no duplicate prefix, no empty
    # file, and SCHEMA_VERSION equal to the highest migration.
    name: Migrations are contiguous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration tests
        run: pnpm --filter @rg/database exec vitest run

  e2e:
    name: Smoke (Playwright, iphone + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # wrangler dev needs Node 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @rg/web exec playwright install --with-deps chromium webkit

      # Fixture mode needs no credentials; these are throwaway values that only
      # have to be well-formed.
      - name: Write throwaway worker secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "ALLOWED_GOOGLE_EMAIL=fixture@example.com"
            echo "GOOGLE_CLIENT_ID=x"
            echo "GOOGLE_CLIENT_SECRET=x"
          } > apps/worker/.dev.vars

      - name: Start the fixture stack
        run: bash apps/web/e2e/fixture-stack.sh

      - name: Smoke suite (both projects)
        run: pnpm --filter @rg/web e2e
        env:
          RG_BASE: http://localhost:5271

      - name: Fixture stack logs
        if: failure()
        run: tail -n 80 "${TMPDIR:-/tmp}"/rg-e2e-state/*.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
