name: Release desktop app

# Builds, signs, and publishes the macOS desktop app on a version tag (e.g.
# `git tag v0.1.1 && git push --tags`). tauri-action attaches the updater
# artifacts (.app.tar.gz + .sig) and a `latest.json` manifest to the GitHub
# release; the installed app polls .../releases/latest/download/latest.json and
# self-updates (see plugins.updater in apps/desktop/src-tauri/tauri.conf.json).
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (GITHUB_TOKEN is provided automatically).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build + sign + publish (macOS arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Ensure aarch64 target
        run: rustup target add aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build COROS bridge sidecar
        run: pnpm --filter @rg/desktop sidecar:build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Run Garden ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      # tauri-action skips latest.json when the productName has a space
      # ("Run Garden"): the uploaded asset is renamed (spaces -> dots) so it no
      # longer matches the on-disk .sig. Build and upload the manifest ourselves.
      - name: Generate + upload updater manifest (latest.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          TARBALL=$(find . -type f -name '*.app.tar.gz' 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error::no .app.tar.gz found"; find . -name '*.app.tar.gz*' 2>/dev/null | head; exit 1
          fi
          # Re-sign the built tarball so we always have a valid .sig (independent
          # of where/whether tauri-action left one).
          pnpm --filter @rg/desktop exec tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TARBALL"
          SIG=$(cat "$TARBALL.sig")
          ASSET=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | select(.name|endswith(".app.tar.gz")) | .name' | head -1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg v "$VERSION" --arg sig "$SIG" --arg url "$URL" --arg date "$DATE" \
            '{version:$v, notes:("Run Garden "+$v), pub_date:$date,
              platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json -R "$GITHUB_REPOSITORY" --clobber
