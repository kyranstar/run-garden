[package]
name = "run-garden-desktop"
version = "0.1.4"
description = "Run Garden desktop companion"
authors = ["Run Garden"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "run_garden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encrypted, machine-bound credential store (see src/creds.rs). Not the OS
# keychain: keychain items are pinned to the app's code signature, which changes
# on every unsigned self-update; an encrypted file survives updates.
aes-gcm = { version = "0.10", features = ["aes", "std", "getrandom"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
