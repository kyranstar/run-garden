# Cloudflare Worker configuration (wrangler v4).
#
# One-time setup before the first deploy:
#   1. cd apps/worker && export WRANGLER_WRITE_LOGS=false   # keeps wrangler output off disk (docs/STAGING.md)
#   2. npx wrangler d1 create run-garden-db
#      → copy the printed database_id and paste it into [[d1_databases]] below.
#   3. Set secrets (see the root .env.example for the full list):
#        npx wrangler secret put SESSION_SECRET
#        npx wrangler secret put TOKEN_ENCRYPTION_KEY   # openssl rand -base64 32
#        npx wrangler secret put ALLOWED_GOOGLE_EMAIL
#        npx wrangler secret put GOOGLE_CLIENT_ID
#        npx wrangler secret put GOOGLE_CLIENT_SECRET
#        # optional: STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET /
#        #           STRAVA_WEBHOOK_VERIFY_TOKEN / ANTHROPIC_API_KEY /
#        #           COROS_MCP_URL / COROS_MCP_TOKEN / STRAVA_API_BASE
#   4. npx wrangler d1 migrations apply run-garden-db --remote
#   5. pnpm --filter @rg/web build   (assets below are served from ../web/dist)
#   6. npx wrangler deploy
#
# The database name is brand-neutral on purpose; rename in one place if needed.
name = "run-garden-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Run the worker near its D1 primary (ORD) instead of the user's edge: every
# hot read is a batch of D1 round trips, so execution locality dominates
# first-byte latency (P2 latency audit).
[placement]
mode = "smart"

# Static assets: the built web app is uploaded alongside the worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/assets/*"]

[[d1_databases]]
binding = "DB"
database_name = "run-garden-db"
# Replace after `wrangler d1 create run-garden-db`:
database_id = "00acb208-8450-4bc0-88da-6b1e75f76280"
migrations_dir = "../../packages/database/migrations"

# The coach designer's steps run in a Durable Object's alarm, one object per run (services/coach-run-stepper.ts):
# a closed tab can't kill a step. SQLite-backed — the only kind the Workers Free plan has. The binding is declared
# again in every environment (never inherited); the migration is inherited. Nothing reaches the object while the
# coach designer is off here (its routes are a 404).
[[durable_objects.bindings]]
name = "COACH_RUN_STEPPER"
class_name = "CoachRunStepper"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoachRunStepper"]

[triggers]
crons = [
  "*/30 * * * *",  # calendar + provider sync
  "15 * * * *",    # hourly reconcile + garden simulation
  "0 20 * * MON",  # weekly review (Cloudflare numeric 1 = SUNDAY — audit#2 #8)
]

[vars]
# Non-secret configuration. Secrets are set with `wrangler secret put`:
#   SESSION_SECRET, TOKEN_ENCRYPTION_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   ALLOWED_GOOGLE_EMAIL, STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET,
#   STRAVA_WEBHOOK_VERIFY_TOKEN, AI_GATEWAY_API_KEY
APP_URL = "https://run-garden-api.kyranadams.workers.dev"
FIXTURE_MODE = "0"
AI_DEFAULT_ENABLED = "1"
# LLM via Vercel AI Gateway (OpenAI-compatible). Key is a secret; model is here.
AI_GATEWAY_MODEL = "anthropic/claude-haiku-4.5"
# The standalone import writes (POST /api/import/standalone without dryRun) — on since Phase 2d gated the garden
# against imported history (routes/imports.ts).
IMPORT_ENABLED = "1"
# Program sessions on the watch (Phase 3): on since the owner approved the first live push on 2026-10-09 (plan
# 2026-10-08-phase-3-watch.md Task 12). Only "1" is on. Staging keeps it absent; wrangler-config.test.ts pins both.
WATCH_PUSH_ENABLED = "1"
# The coach's steps in the run stepper's alarm (only "1" is on; anything else, the step in the client's request).
# Staging keeps it absent; wrangler-config.test.ts pins both.
COACH_STEP_ALARM = "1"
# The coach designer (/api/coach/runs, its preferences and suggestions, the objectives board, the hourly sweep): on since
# the owner's go-live, 2026-10-16 (Stage 3 Task 12). Only "1" is on; remove it to turn the coach's routes back into a 404.
# The web build's VITE_COACH_DESIGNER (.github/workflows/deploy.yml) shows it. coach-runs-routes.test.ts pins it.
COACH_DESIGNER = "1"
# The music dock (2026-10-17): the owner's Spotify app Client ID (public in a PKCE flow, so a var). Empty, every
# /api/music route is a 404 and the dock draws nothing. The app's redirect URI to register with Spotify is
# APP_URL + /api/music/spotify/callback (and http://127.0.0.1:8787/api/music/spotify/callback for local dev).
SPOTIFY_CLIENT_ID = ""

# ── Staging (inert: no crons, outbound fetch guarded — see docs/STAGING.md) ──
# vars, d1_databases and triggers are declared in full; nothing here points at
# production's database.
[env.staging]
name = "run-garden-staging"
workers_dev = true

[env.staging.vars]
APP_URL = "https://run-garden-staging.kyranadams.workers.dev"
FIXTURE_MODE = "0"
AI_DEFAULT_ENABLED = "0"
STAGING = "1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "run-garden-db-staging"
# The orchestrator fills this when the database is created.
database_id = "c8d38f02-0723-4990-8220-5492a1b29824"
migrations_dir = "../../packages/database/migrations"

[env.staging.triggers]
crons = []

# The run stepper's binding (a binding is never inherited; the class's migration is). The step alarm's switch stays off
# here: staging's coach steps in the request, as before.
[[env.staging.durable_objects.bindings]]
name = "COACH_RUN_STEPPER"
class_name = "CoachRunStepper"
